apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: GHA-002
  title: Declare minimal token permissions in every workflow
  type: requirement
  category: security
spec:
  severity: warning
  intent: >
    Without a permissions block, GITHUB_TOKEN gets the repository or organization default,
    which is often read-write on everything. Any compromised step can then push code or
    tamper with releases.
  requirement: >
    Every workflow sets a top-level permissions block with the least access it needs
    (usually contents: read, or permissions: {}), and jobs that need more request it in
    their own permissions block.
  remediation: >
    Add a top-level permissions: block (e.g. permissions: { contents: read }) and grant
    extra scopes such as pull-requests: write or id-token: write only on the jobs that use them.
  examples:
    approved:
      - code: |
          permissions:
            contents: read
          jobs:
            release:
              permissions:
                contents: write
        language: yaml
    forbidden:
      - "A workflow with no permissions block at the top level"
  checks:
    - evaluator: regex
      mode: require
      pattern: '^permissions[ \t]*:'
      include: [".github/workflows/*.yml", ".github/workflows/*.yaml"]
      message: Workflow does not declare top-level permissions
  references:
    - { id: CWE-250, title: Execution with Unnecessary Privileges }
  quality:
    noise: medium
    knownFalsePositives:
      - Workflows that set permissions on every job but not at the top level. Add permissions {} at the top level to satisfy the check and to cover jobs added later.
  rollout:
    recommendedStage: advise
