apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: SEC-013
  title: Do not enable SSLv3, TLS 1.0, or TLS 1.1
  type: prohibition
  category: security
spec:
  severity: warning
  intent: SSLv3, TLS 1.0, and TLS 1.1 are deprecated (RFC 8996) and have known practical attacks.
  requirement: >
    Use TLS 1.2 or later. Do not select or allow SSLv3, TLS 1.0, or TLS 1.1 as a protocol or
    minimum version; let the platform default negotiate, or pin a minimum of TLS 1.2.
  examples:
    approved:
      - "ctx = ssl.create_default_context()"
      - "&tls.Config{MinVersion: tls.VersionTLS12}"
      - "ssl_protocols TLSv1.2 TLSv1.3;"
    forbidden:
      - "ssl.SSLContext(ssl.PROTOCOL_TLSv1)"
      - "&tls.Config{MinVersion: tls.VersionTLS10}"
      - "secureProtocol: 'TLSv1_method'"
      - "ssl_protocols TLSv1 TLSv1.1 TLSv1.2;"
  remediation: >
    Remove the explicit protocol selection so the platform default applies, or set the minimum
    version to TLS 1.2. Upgrade any peer that cannot negotiate TLS 1.2.
  checks:
    - evaluator: regex
      pattern: '\bssl\.PROTOCOL_(?:SSLv2|SSLv3|TLSv1|TLSv1_1)\b|\bTLSVersion\.(?:SSLv3|TLSv1|TLSv1_1)\b|\btls\.Version(?:SSL30|TLS10|TLS11)\b|\b(?:SSLv2|SSLv3|TLSv1|TLSv1_1)_(?:client_|server_)?method\b|\bminVersion\s*:\s*["''](?:SSLv3|TLSv1|TLSv1\.1)["'']|\bSecurityProtocolType\.(?:Ssl3|Tls|Tls11)\b|\bSSLContext\.getInstance\(\s*"(?:SSLv3|TLSv1|TLSv1\.1)"|^\s*ssl_protocols\b[^;\n]*?(?<![\w.])(?:SSLv2|SSLv3|TLSv1(?:\.1)?)(?![\w.])'
      exclude:
        - "**/*.md"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/*_test.*"
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/fixtures/**"
        - "**/testdata/**"
      message: Deprecated SSL/TLS protocol version enabled
  references:
    - { id: CWE-326, title: Inadequate Encryption Strength }
    - { id: CWE-327, title: Use of a Broken or Risky Cryptographic Algorithm }
    - { id: RFC-8996, title: Deprecating TLS 1.0 and TLS 1.1, url: "https://www.rfc-editor.org/rfc/rfc8996" }
  compliance:
    - { framework: owasp-asvs, controls: [V9.1.3] }
    - { framework: pci-dss, controls: ["4.2.1"] }
    - { framework: soc2, controls: [CC6.7] }
    - { framework: iso-27001, controls: ["8.24"] }
  quality:
    noise: low
    knownFalsePositives:
      - >
        Code that talks to a legacy peer which cannot be upgraded yet. Record a time-boxed
        exception instead of disabling the standard.
  rollout:
    recommendedStage: enforce
