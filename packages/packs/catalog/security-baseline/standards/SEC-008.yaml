apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: SEC-008
  title: No Slack webhook URLs in code
  type: prohibition
  category: security
spec:
  severity: blocker
  intent: Anyone holding an incoming-webhook URL can post messages into your Slack workspace, including convincing phishing.
  requirement: >
    Treat Slack incoming-webhook URLs as secrets. Never commit them; read them from the
    environment or a secret manager.
  examples:
    approved:
      - "const url = process.env.SLACK_WEBHOOK_URL;"
    forbidden:
      - 'SLACK_WEBHOOK = "https://hooks.slack.com/services/T.../B.../..."'
  remediation: >
    Regenerate the webhook in the Slack app settings (this revokes the leaked URL) and read the
    new URL from the environment or your secret manager.
  checks:
    - evaluator: regex
      # Slack's documented placeholder (T00000000/B00000000/XXXX...) is not flagged.
      pattern: 'https://hooks\.slack\.com/services/T(?!0+/)[A-Z0-9]{8,}/B[A-Z0-9]{8,}/(?![Xx]{24})[A-Za-z0-9]{24}\b'
      message: Slack incoming-webhook URL found in code
  references:
    - { id: CWE-798, title: Use of Hard-coded Credentials }
  compliance:
    - { framework: owasp-asvs, controls: [V2.10.4] }
    - { framework: soc2, controls: [CC6.1] }
    - { framework: iso-27001, controls: ["5.17"] }
  quality:
    noise: low
    knownFalsePositives:
      - Webhook URLs for channels that have already been deleted, kept in old docs. Rewrite them as placeholders.
  rollout:
    recommendedStage: enforce
