apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: SEC-016
  title: Never deserialize untrusted data with native object serializers
  type: prohibition
  category: security
spec:
  severity: blocker
  intent: Native deserializers can instantiate arbitrary types, so untrusted input becomes remote code execution.
  requirement: >
    Do not pass data from users, the network, queues, or shared storage to deserializers that
    can construct arbitrary objects: Python pickle/marshal/shelve and yaml.load with an unsafe
    loader, Java ObjectInputStream, .NET BinaryFormatter, PHP unserialize, Ruby Marshal.load and
    YAML.unsafe_load, or JSON libraries with polymorphic type handling enabled. Use a data-only
    format (JSON, protobuf) parsed into explicit types and validated against a schema.
  examples:
    approved:
      - { code: "data = yaml.safe_load(body)", language: python }
      - { code: "const order = OrderSchema.parse(JSON.parse(body));", language: typescript }
    forbidden:
      - { code: "obj = pickle.loads(request.data)", language: python }
      - { code: "new ObjectInputStream(socket.getInputStream()).readObject()", language: java }
  agent:
    summary: >
      Never deserialize untrusted data with pickle, yaml.load, ObjectInputStream, BinaryFormatter,
      unserialize, or Marshal; parse JSON or protobuf into explicit types and validate it.
  remediation: >
    Replace the native serializer with a data-only format and explicit types: JSON or protobuf
    parsed into a schema (pydantic, zod, Jackson with known classes, System.Text.Json). Where the
    format cannot change, verify a signature over the bytes before deserializing and restrict
    the classes that may be created.
  checks:
    - evaluator: regex
      # Python: pickle, cPickle, dill or marshal loading data.
      pattern: |-
        ^(?![ \t]*#)[^\n]*?(?<![\w.])(?:c?[Pp]ickle|dill|marshal)\.(?:loads?|Unpickler)\s*\(
      include: ["**/*.py"]
      exclude: ["**/*.test.*", "**/*.spec.*", "**/test_*.py", "**/*_test.py", "**/*_test.go", "**/*Test.java", "**/*Tests.java", "**/tests/**", "**/test/**", "**/__tests__/**", "**/fixtures/**"]
      message: Native deserialization (pickle, dill, marshal) runs code from the data; use JSON or a schema
    - evaluator: regex
      # Java and Kotlin: reading objects with ObjectInputStream.
      pattern: |-
        ^(?![ \t]*(?://|/?\*))[^\n]*?\bnew\s+ObjectInputStream\s*\(|^(?![ \t]*(?://|/?\*))[^\n]*?\bObjectInputStream\s*\(
      include: ["**/*.java", "**/*.kt"]
      exclude: ["**/*.test.*", "**/*.spec.*", "**/test_*.py", "**/*_test.py", "**/*_test.go", "**/*Test.java", "**/*Tests.java", "**/tests/**", "**/test/**", "**/__tests__/**", "**/fixtures/**"]
      message: ObjectInputStream deserializes arbitrary classes; use JSON or protobuf with explicit types
    - evaluator: regex
      # C#: BinaryFormatter, NetDataContractSerializer, SoapFormatter, LosFormatter.
      pattern: |-
        ^(?![ \t]*(?://|/?\*))[^\n]*?\bnew\s+(?:BinaryFormatter|NetDataContractSerializer|SoapFormatter|LosFormatter)\b
      include: ["**/*.cs"]
      exclude: ["**/*.test.*", "**/*.spec.*", "**/test_*.py", "**/*_test.py", "**/*_test.go", "**/*Test.java", "**/*Tests.java", "**/tests/**", "**/test/**", "**/__tests__/**", "**/fixtures/**"]
      message: This serializer can construct arbitrary types from input; use System.Text.Json with explicit types
    - evaluator: regex
      # PHP: unserialize() without allowed_classes => false.
      pattern: |-
        ^(?![ \t]*(?://|#|/?\*))[^\n]*?(?<![\w>:])unserialize\s*\((?![^;\n]*allowed_classes[\'"]?\s*=>\s*false)
      include: ["**/*.php"]
      exclude: ["**/*.test.*", "**/*.spec.*", "**/test_*.py", "**/*_test.py", "**/*_test.go", "**/*Test.java", "**/*Tests.java", "**/tests/**", "**/test/**", "**/__tests__/**", "**/fixtures/**"]
      message: unserialize() can instantiate arbitrary classes; use json_decode, or pass ['allowed_classes' => false]
    - evaluator: regex
      # Ruby: Marshal.load, and YAML.load/unsafe_load (YAML.safe_load is fine).
      pattern: |-
        ^(?![ \t]*#)[^\n]*?(?:\bMarshal\.(?:load|restore)\b|\bYAML\.(?:unsafe_load|load_documents)\b)
      include: ["**/*.rb"]
      exclude: ["**/*.test.*", "**/*.spec.*", "**/test_*.py", "**/*_test.py", "**/*_test.go", "**/*Test.java", "**/*Tests.java", "**/tests/**", "**/test/**", "**/__tests__/**", "**/fixtures/**"]
      message: Marshal.load and unsafe YAML loading construct arbitrary objects; use JSON or YAML.safe_load
  references:
    - { id: CWE-502, title: Deserialization of Untrusted Data }
    - { id: OWASP-A08:2021, title: Software and Data Integrity Failures, url: "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/" }
  compliance:
    - { framework: owasp-asvs, controls: [V5.5.3] }
    - { framework: iso-27001, controls: ["8.28"] }
    - { framework: soc2, controls: [CC6.8] }
  quality:
    noise: medium
    knownFalsePositives:
      - "Loading a file the service itself wrote and no user can reach, such as a local model or cache file. Add an exception for that file, with the reason."
  rollout:
    recommendedStage: advise
