apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: SEC-004
  title: Do not disable TLS verification
  type: prohibition
  category: security
spec:
  severity: blocker
  intent: Disabling certificate checks makes every connection open to interception.
  requirement: >
    Never disable TLS certificate verification, not even "temporarily" or in scripts.
    Fix the trust store or certificate instead.
  remediation: >
    Remove the override and fix the certificate or trust store instead.
  examples:
    forbidden:
      - "rejectUnauthorized: false"
      - "requests.get(url, verify=False)"
      - "InsecureSkipVerify: true"
  checks:
    - evaluator: regex
      pattern: "rejectUnauthorized\\s*:\\s*false|NODE_TLS_REJECT_UNAUTHORIZED\\s*=\\s*['\"]?0|verify\\s*=\\s*False\\b|InsecureSkipVerify\\s*:\\s*true"
      message: TLS certificate verification is disabled
      # Tests commonly talk to local TLS test servers with self-signed certificates.
      exclude: ["**/*.md", "**/*_test.go", "**/*.test.*", "**/*.spec.*", "**/test/**", "**/tests/**", "**/__tests__/**", "**/testdata/**", "**/conftest.py", "**/test_*.py"]
  references:
    - { id: CWE-295, title: Improper Certificate Validation }
  compliance:
    - { framework: owasp-asvs, controls: [V9.2.1] }
    - { framework: pci-dss, controls: ["4.2.1"] }
    - { framework: hipaa, controls: ["164.312(e)(1)"] }
    - { framework: soc2, controls: [CC6.7] }
    - { framework: iso-27001, controls: ["8.24"] }
  quality:
    noise: medium
    knownFalsePositives:
      - Unrelated APIs that take a verify=False argument (e.g. some Python libraries). Exclude those files with scope.exclude.
  rollout:
    recommendedStage: advise
