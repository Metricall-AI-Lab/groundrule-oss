apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: SEC-002
  title: No environment files in the repository
  type: prohibition
  category: security
spec:
  severity: blocker
  intent: .env files hold real credentials and are the most common source of leaked secrets.
  requirement: >
    Do not commit .env files. Commit a .env.example with placeholder values instead.
  remediation: >
    Remove the file from git (git rm --cached), add it to .gitignore, and rotate any secrets it contained.
  examples:
    approved: [".env.example with placeholder values"]
    forbidden: [".env with real values"]
  checks:
    - evaluator: files
      forbid: ["**/.env", "**/.env.*"]
      allow:
        - "**/.env.example"
        - "**/.env.sample"
        - "**/.env.template"
        - "**/.env.*.example"
        # Fixtures for code that loads .env files (e.g. Flask's tests/test_apps/.env).
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/testdata/**"
        - "**/fixtures/**"
      message: Environment file committed to the repository
  references:
    - { id: CWE-538, title: Insertion of Sensitive Information into Externally-Accessible File or Directory }
    - { id: CWE-798, title: Use of Hard-coded Credentials }
  compliance:
    - { framework: owasp-asvs, controls: [V2.10.4] }
    - { framework: soc2, controls: [CC6.1] }
    - { framework: iso-27001, controls: ["5.17"] }
  quality:
    noise: low
    knownFalsePositives:
      - Env files that intentionally hold only non-secret defaults (e.g. .env.defaults). Add them to the check's allow list.
  rollout:
    recommendedStage: enforce
