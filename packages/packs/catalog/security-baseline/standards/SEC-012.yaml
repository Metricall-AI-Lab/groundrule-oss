apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: SEC-012
  title: No hard-coded passwords or secrets in string literals
  type: prohibition
  category: security
spec:
  severity: warning
  intent: Passwords written into code or config ship to every clone, build log, and container image, and are rarely rotated.
  requirement: >
    Do not assign literal passwords or secrets to password, passwd, or secret fields and
    variables. Read them from the environment or a secret manager; use obvious placeholders in
    examples and keep test credentials in test code.
  examples:
    approved:
      - 'password = os.environ["DB_PASSWORD"]'
      - 'password: "${DB_PASSWORD}"'
    forbidden:
      - 'const DB_PASSWORD = "Tr0ub4dor&3";'
      - 'connect(user="app", password="s3cr3t-pa55")'
  remediation: >
    Rotate the credential, then read it from the environment or your secret manager. For local
    development, load it from an untracked .env file.
  checks:
    - evaluator: regex
      flags: i
      # A *password / *passwd / *secret key assigned a quoted literal of 8+ characters with no
      # whitespace. Placeholders, templating, and the bare key name itself are skipped.
      pattern: '\b[A-Za-z0-9_]*(?:password|passwd|secret)["'']?\s*[:=]\s*["''](?!(?:password|passwd|secret)["''])(?![^"''\n]*(?:example|change|placeholder|your|dummy|redacted|xxxx|\*\*\*|<|>|\$\{|\{\{|%\())[^"''\s]{8,}["'']'
      include:
        - "**/*.{ts,tsx,js,jsx,mjs,cjs,py,go,java,kt,kts,scala,rb,php,cs,rs,swift}"
        - "**/*.{yaml,yml,json,toml,ini,cfg,conf,xml}"
      exclude:
        - "**/*.md"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/*_test.*"
        - "**/test_*"
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/fixtures/**"
        - "**/testdata/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/*.example.*"
        - "**/*.sample.*"
        - "**/locales/**"
        - "**/locale/**"
        - "**/i18n/**"
        - "**/translations/**"
        - "**/docker-compose*.{yml,yaml}"
        - "**/compose*.{yml,yaml}"
        - "**/seeds/**"
        - "**/seeders/**"
        - "**/package-lock.json"
      message: Hard-coded password or secret
  references:
    - { id: CWE-798, title: Use of Hard-coded Credentials }
    - { id: CWE-259, title: Use of Hard-coded Password }
  compliance:
    - { framework: owasp-asvs, controls: [V2.10.4] }
    - { framework: pci-dss, controls: ["8.6.2"] }
    - { framework: soc2, controls: [CC6.1] }
    - { framework: iso-27001, controls: ["5.17"] }
  quality:
    noise: medium
    knownFalsePositives:
      - >
        Development-only defaults (local databases, demo apps) outside the excluded test,
        example, seed, and compose paths. Add those paths to the check's exclude list.
      - >
        Fields named *secret that hold a reference rather than a value (e.g. a secret manager
        resource name). Rename the field (secretName, secretRef) or exclude the file.
  rollout:
    recommendedStage: advise
