apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: SEC-005
  title: Commit a dependency lockfile
  type: repository
  category: supply-chain
spec:
  severity: warning
  scope:
    languages: [typescript, javascript, python, rust, go]
  intent: Without a lockfile, every install can pull different, possibly compromised, versions.
  requirement: >
    Commit the lockfile your package manager produces.
  remediation: >
    Run your package manager's install and commit the lockfile it creates.
  checks:
    - evaluator: files
      requireAny:
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
        - "**/bun.lock"
        - "**/bun.lockb"
        - "**/poetry.lock"
        - "**/uv.lock"
        - "**/Pipfile.lock"
        - "**/Cargo.lock"
        - "**/go.sum"
      message: No dependency lockfile is committed
  references:
    - { id: CWE-1357, title: Reliance on Insufficiently Trustworthy Component }
    - { id: OWASP-A08:2021, title: Software and Data Integrity Failures, url: "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/" }
  applicability:
    files: ["**/package.json", "**/pyproject.toml", "**/requirements*.txt", "**/Cargo.toml", "**/go.mod"]
  quality:
    noise: low
    knownFalsePositives:
      - Libraries that deliberately do not commit a lockfile. Disable the standard for those repositories.
  rollout:
    recommendedStage: enforce
