apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: SEC-010
  title: No Azure storage or Service Bus keys in connection strings
  type: prohibition
  category: security
spec:
  severity: blocker
  intent: An AccountKey or SharedAccessKey in a connection string gives full access to the storage account or messaging namespace.
  requirement: >
    Never commit Azure connection strings that embed an AccountKey or SharedAccessKey.
    Prefer managed identity; otherwise read the connection string from Key Vault or the environment.
  examples:
    approved:
      - "new BlobServiceClient(url, new DefaultAzureCredential())"
      - "UseDevelopmentStorage=true"
    forbidden:
      - "DefaultEndpointsProtocol=https;AccountName=prod;AccountKey=<88-character key>;EndpointSuffix=core.windows.net"
  remediation: >
    Rotate the account key or shared access key in the Azure portal, then switch to managed
    identity or load the connection string from Key Vault or the environment.
  checks:
    - evaluator: regex
      # The Azurite / storage emulator key is public and documented, so it is not flagged.
      pattern: '\bAccountKey=(?!Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==)[A-Za-z0-9+/]{86}==|\bSharedAccessKey=[A-Za-z0-9+/]{43}='
      message: Azure connection string with an embedded key found in code
  references:
    - { id: CWE-798, title: Use of Hard-coded Credentials }
  compliance:
    - { framework: owasp-asvs, controls: [V2.10.4] }
    - { framework: soc2, controls: [CC6.1] }
    - { framework: iso-27001, controls: ["5.17"] }
  quality:
    noise: low
    knownFalsePositives:
      - Keys of deleted or emulator-only accounts kept in samples. Replace them with placeholders.
  rollout:
    recommendedStage: enforce
