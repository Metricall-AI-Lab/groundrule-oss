apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: REACT-004
  title: Use refs, not document queries, inside components
  type: guidance
  category: architecture
spec:
  severity: advisory
  scope:
    languages: [typescript, javascript]
    frameworks: [react]
  intent: Querying the document from a component breaks with multiple instances, server rendering, and portals, and races React's own DOM updates.
  requirement: >
    Components reach their own DOM nodes through refs (useRef, callback refs, forwardRef)
    and change the DOM through state and props. document.getElementById, querySelector, and
    getElementsBy* belong only in the app entry point (mounting the root) and in
    non-component integration code.
  remediation: >
    Attach a ref to the element (const inputRef = useRef(null); <input ref={inputRef} />)
    and use inputRef.current inside an effect or event handler.
  examples:
    approved:
      - "const inputRef = useRef<HTMLInputElement>(null); useEffect(() => inputRef.current?.focus(), []);"
    forbidden:
      - "useEffect(() => { document.getElementById('email')?.focus(); }, []);"
  checks:
    - evaluator: regex
      # Skips comment lines and lines that mount a root or create a portal.
      pattern: '^(?![ \t]*(?://|/?\*))(?![^\n]*\b(?:createRoot|hydrateRoot|createPortal|render)\s*\()[^\n]*?\bdocument\s*\.\s*(?:getElementById|querySelector|querySelectorAll|getElementsByClassName|getElementsByTagName|getElementsByName)\s*\('
      include: ["**/*.jsx", "**/*.tsx"]
      exclude: ["**/node_modules/**", "**/dist/**", "**/build/**", "**/*.test.*", "**/*.spec.*", "**/test/**", "**/tests/**", "**/__tests__/**", "**/*.stories.*", "**/examples/**", "**/example/**", "**/docs/**", "**/fixtures/**", "**/main.jsx", "**/main.tsx", "src/index.jsx", "src/index.tsx", "**/_document.jsx", "**/_document.tsx"]
      message: Direct DOM query in a React component; use a ref
  references:
    - https://react.dev/learn/manipulating-the-dom-with-refs
  applicability:
    frameworks: [react]
    files: ["**/package.json"]
  quality:
    noise: medium
    knownFalsePositives:
      - Integrations with non-React widgets or third-party scripts that need a global element. Record an exception for those files.
      - Entry files with names other than main or src/index. Add them to scope.exclude.
  rollout:
    recommendedStage: advise
