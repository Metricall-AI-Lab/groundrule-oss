apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: TEST-011
  title: Do not commit test results or coverage output
  type: repository
  category: testing
spec:
  severity: warning
  intent: >
    Test and coverage output is regenerated on every run; committed copies go stale immediately,
    bloat the repository, and cause merge conflicts.
  requirement: >
    Do not commit coverage reports or test-run output (coverage/lcov.info, .nyc_output, htmlcov,
    .coverage, .pytest_cache, Playwright test-results and playwright-report). Add them to
    .gitignore and publish them as CI artifacts if needed.
  remediation: >
    Remove the files with git rm -r --cached, add the directories to .gitignore, and upload them
    as CI artifacts if people need them.
  checks:
    - evaluator: files
      forbid:
        - "**/.nyc_output/**"
        - "**/coverage/lcov.info"
        - "**/coverage/coverage-final.json"
        - "**/coverage/lcov-report/**"
        - "**/htmlcov/**"
        - "**/.coverage"
        - "**/.coverage.*"
        - "**/.pytest_cache/**"
        - "**/playwright-report/**"
        - "**/test-results/.last-run.json"
      allow:
        - "**/fixtures/**"
        - "**/__fixtures__/**"
        - "**/testdata/**"
      message: Test or coverage output committed to the repository
  quality:
    noise: low
    knownFalsePositives:
      - Tools that parse coverage reports and keep sample reports outside a fixtures/ or testdata/ folder. Exclude those paths with scope.exclude.
  rollout:
    recommendedStage: enforce
