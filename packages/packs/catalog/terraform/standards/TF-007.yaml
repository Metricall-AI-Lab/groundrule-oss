apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: TF-007
  title: No Terraform state files in the repository
  type: prohibition
  category: security
spec:
  severity: blocker
  scope:
    languages: [terraform]
  intent: >
    State files contain every attribute of every managed resource in plain text, including
    generated passwords, private keys, and connection strings.
  requirement: >
    Never commit terraform.tfstate or its backups. Store state in a remote backend with
    encryption and access control.
  remediation: >
    Move state to a remote backend (terraform init -migrate-state), remove the files from
    git (git rm --cached), add *.tfstate and *.tfstate.* to .gitignore, and rotate any
    secrets the state contained. Consider purging them from history.
  checks:
    - evaluator: files
      forbid: ["**/*.tfstate", "**/*.tfstate.*"]
      allow: ["**/testdata/**", "**/fixtures/**"]
      message: Terraform state file committed to the repository
  references:
    - { id: CWE-312, title: Cleartext Storage of Sensitive Information }
    - { id: CWE-538, title: Insertion of Sensitive Information into Externally-Accessible File or Directory }
  compliance:
    - { framework: soc2, controls: [CC6.1] }
  quality:
    noise: low
    knownFalsePositives:
      - Synthetic state files used as test fixtures outside testdata/ or fixtures/. Add them to the check's allow list.
  rollout:
    recommendedStage: enforce
