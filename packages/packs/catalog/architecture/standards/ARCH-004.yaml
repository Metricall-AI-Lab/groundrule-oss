apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: ARCH-004
  title: UI components never import data access directly
  type: prohibition
  category: architecture
spec:
  severity: warning
  scope:
    languages: [typescript, javascript]
  intent: >
    Components that query the database or call repositories can't be rendered in isolation,
    leak server concerns into the client bundle, and bypass the validation the data layer
    provides.
  requirement: >
    Code under components (or ui, views) must not import from data-access directories
    (data, db, repositories, prisma, models) nor use a database client package directly.
    Fetch through the project's data layer, hooks or server functions.
  remediation: >
    Move the query into the data layer or a server function, and call that from the
    component.
  examples:
    approved:
      - { code: "const orders = useOrders(customerId);", language: typescript }
    forbidden:
      - { code: "import { prisma } from \"../db/client\";", language: typescript, note: "inside a component" }
  checks:
    - evaluator: imports
      from: ["**/components/**", "**/ui/**", "**/views/**"]
      forbid: ["**/data/**", "**/db/**", "**/repositories/**", "**/prisma/**", "**/models/**"]
      message: A UI component imports data access directly
      remediation: Go through the data layer, a hook or a server function.
    - evaluator: imports
      package: ["@prisma/client", "prisma", "pg", "mysql2", "knex", "typeorm", "sequelize", "mongoose", "drizzle-orm"]
      only: ["**/data/**", "**/db/**", "**/repositories/**", "**/infra/**", "**/infrastructure/**", "**/server/**"]
      message: A UI component uses a database client directly
      remediation: Go through the data layer, a hook or a server function.
  compliance:
    - { framework: iso-27001, controls: ["8.27"] }
  quality:
    noise: low
    knownFalsePositives:
      - "`models` directories that hold view models rather than persistence models. Narrow the check's paths."
  rollout:
    recommendedStage: observe
