apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: ARCH-002
  title: The application layer never imports delivery code
  type: prohibition
  category: architecture
spec:
  severity: warning
  scope:
    languages: [typescript, javascript, python]
  intent: >
    Use cases that import controllers, request types or route handlers become tied to one
    transport, and can't be driven from a job, a CLI or a test.
  requirement: >
    Code under the application (or use-cases, services) directory must not import from
    delivery directories (api, http, controllers, routes, graphql, cli). Delivery calls the
    application, never the reverse.
  remediation: >
    Pass plain inputs into the use case and return plain results; let the controller map
    requests and responses.
  examples:
    approved:
      - { code: "export async function placeOrder(input: PlaceOrderInput) {}", language: typescript }
    forbidden:
      - { code: "import { OrderController } from \"../api/orders\";", language: typescript }
  checks:
    - evaluator: imports
      from: ["**/application/**", "**/usecases/**", "**/use-cases/**", "**/services/**"]
      forbid: ["**/api/**", "**/http/**", "**/controllers/**", "**/routes/**", "**/graphql/**", "**/cli/**"]
      message: Application code imports delivery code
      remediation: Let the controller map the request and call the use case with plain inputs.
  compliance:
    - { framework: iso-27001, controls: ["8.27"] }
  quality:
    noise: low
    knownFalsePositives:
      - Shared types that happen to live under a delivery directory. Move them to a shared or domain directory, or allow the file in the check.
  rollout:
    recommendedStage: observe
