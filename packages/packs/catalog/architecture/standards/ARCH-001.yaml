apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: ARCH-001
  title: The domain layer never imports infrastructure or delivery code
  type: prohibition
  category: architecture
spec:
  severity: warning
  scope:
    languages: [typescript, javascript, python, java, kotlin, go]
  intent: >
    Business rules that import databases, HTTP clients or controllers can't be tested
    without them and can't be reused when the infrastructure changes. Agents cross this
    line constantly because the import is the shortest path to making a test pass.
  requirement: >
    Code under the domain directory must not import from infrastructure, persistence or
    delivery directories (infra, infrastructure, db, api, http, controllers, routes).
    Depend on interfaces the domain owns and inject implementations from outside. Adjust the
    directory names in the check to your layout.
  remediation: >
    Move the import behind an interface in the domain (a repository or gateway type), and
    pass the implementation in from the composition root or the delivery layer.
  examples:
    approved:
      - { code: "import type { OrderRepository } from \"./ports\";", language: typescript, note: "the domain owns the port" }
    forbidden:
      - { code: "import { db } from \"../infra/db/client\";", language: typescript, note: "domain reaching into infrastructure" }
      - { code: "import com.acme.shop.infra.db.OrderRow;", language: java, note: "domain reaching into infrastructure" }
      - { code: "import \"github.com/acme/shop/internal/infra/db\"", language: go, note: "domain reaching into infrastructure" }
  checks:
    - evaluator: imports
      from: ["**/domain/**"]
      forbid: ["**/infra/**", "**/infrastructure/**", "**/db/**", "**/api/**", "**/http/**", "**/controllers/**", "**/routes/**"]
      message: Domain code imports infrastructure or delivery code
      remediation: Depend on an interface the domain owns; inject the implementation from outside.
  compliance:
    - { framework: iso-27001, controls: ["8.27"] }
  quality:
    noise: low
    knownFalsePositives:
      - A directory named like a layer that isn't one (e.g. a `db` folder of domain value types). Narrow the paths in the check.
  rollout:
    recommendedStage: observe
