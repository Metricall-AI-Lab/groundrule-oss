apiVersion: groundrule.dev/v1alpha1
kind: ActionPolicy
metadata:
  id: ACT-008
  title: Never delete outside the repository
  category: security
spec:
  severity: blocker
  intent: >
    rm -rf on the home directory, the root, or a path outside the repository cannot be undone from
    git.
  requirement: >
    Do not delete the home directory, the filesystem root, or paths outside the repository. Delete
    only files inside the repository, and prefer git rm for tracked files.
  effect: deny
  when:
    actions: [shell]
    commands:
      - "rm -rf /"
      - "rm -rf /*"
      - "rm -rf ~*"
      - "rm -rf $HOME*"
      - "rm -rf ..*"
      - "rm -rf ../*"
      - "rm -fr /*"
      - "rm -fr ~*"
      - "rm -r* /"
      - "rm -r* ~"
      - "rm -r* ~/*"
      - "rm -r* /Users/*"
      - "rm -r* /home/*"
      - "rm -r* /etc*"
      - "rm -r* /var*"
      - "rm -r* /usr*"
  agent:
    summary: Never rm -rf the home directory, the root, or anything outside the repository.
  references:
    - { id: CWE-73, title: External Control of File Name or Path }
  rollout:
    recommendedStage: enforce
