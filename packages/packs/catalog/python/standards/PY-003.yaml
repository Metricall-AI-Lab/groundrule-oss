apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: PY-003
  title: No print() in application code
  type: prohibition
  category: observability
spec:
  severity: warning
  scope:
    languages: [python]
  intent: >
    print() output has no level, logger name, or structure, cannot be filtered or routed,
    and often leaks data into production logs.
  requirement: >
    Use the logging module (a module-level `logger = logging.getLogger(__name__)`) instead of
    print() in library and service code. Tests, scripts, command-line entry points, and
    notebooks may print.
  remediation: >
    Replace print() with a logger call at the right level, or remove it. CLIs that print as
    their output belong under scripts/, cli/, or __main__.py.
  examples:
    approved: ['logger.info("order created", extra={"order_id": order.id})']
    forbidden: ["print(order)"]
  checks:
    - evaluator: regex
      # Skips comment lines and methods or functions such as pprint() or self.print().
      pattern: '^(?![ \t]*#)[^\n]*?(?<![\w.])print[ \t]*\('
      include: ["**/*.py"]
      exclude:
        - "**/test_*.py"
        - "**/*_test.py"
        - "**/tests/**"
        - "**/test/**"
        - "**/conftest.py"
        - "**/fixtures/**"
        - "**/scripts/**"
        - "**/bin/**"
        - "**/tools/**"
        - "**/cli.py"
        - "**/cli/**"
        - "**/__main__.py"
        - "**/manage.py"
        - "**/setup.py"
        - "**/noxfile.py"
        - "**/management/commands/**"
        - "**/examples/**"
        - "**/example/**"
        - "**/docs/**"
        - "**/benchmarks/**"
      message: print() in application code; use logging
  quality:
    noise: medium
    knownFalsePositives:
      - Command-line tools outside the excluded paths, and `if __name__ == "__main__":` blocks. Add their paths to scope.exclude.
      - The text "print(" inside a string literal on a code line.
  rollout:
    recommendedStage: advise
