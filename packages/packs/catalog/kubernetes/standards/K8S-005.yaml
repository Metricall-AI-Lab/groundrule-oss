apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: K8S-005
  title: Harden pod security contexts to the restricted profile
  type: agent-instruction
  category: security
spec:
  severity: warning
  intent: >
    The Pod Security Standards "restricted" profile is the agreed baseline for application
    workloads; each setting removes a common container-escape or persistence path.
  requirement: >
    Application workloads must meet the restricted Pod Security Standard: drop all
    capabilities (capabilities.drop: ["ALL"]) and add back only what is needed, use
    seccompProfile type RuntimeDefault, set readOnlyRootFilesystem: true with emptyDir
    volumes for paths that must be writable, avoid hostPath volumes and hostPort, and set
    automountServiceAccountToken: false unless the pod calls the Kubernetes API.
  agent:
    summary: >
      Write Kubernetes workloads to the restricted Pod Security Standard: drop ALL
      capabilities, seccompProfile RuntimeDefault, readOnlyRootFilesystem true (emptyDir for
      writable paths), no hostPath or hostPort, and automountServiceAccountToken false unless
      the pod needs the API.
  examples:
    approved:
      - code: |
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: api
                image: ghcr.io/acme/api:1.8.2
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - { name: tmp, mountPath: /tmp }
            volumes:
              - { name: tmp, emptyDir: {} }
        language: yaml
  references:
    - { id: CWE-250, title: Execution with Unnecessary Privileges }
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
    - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  quality:
    noise: low
  rollout:
    recommendedStage: teach
