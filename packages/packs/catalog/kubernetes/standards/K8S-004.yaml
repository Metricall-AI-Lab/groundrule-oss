apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: K8S-004
  title: Require runAsNonRoot
  type: requirement
  category: security
spec:
  severity: warning
  intent: >
    runAsNonRoot makes the kubelet refuse to start a container whose image would run as
    UID 0, so a missing USER in a Dockerfile cannot silently put root in production.
  requirement: >
    Set securityContext.runAsNonRoot: true on the pod (or on every container), and run the
    image as a numeric non-zero UID (USER in the Dockerfile or runAsUser).
  remediation: >
    Add runAsNonRoot: true to the pod securityContext. If the image runs as a named user,
    also set runAsUser to its numeric UID so the kubelet can verify it.
  examples:
    approved:
      - code: |
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
        language: yaml
  agent:
    summary: >
      Set securityContext.runAsNonRoot: true (with a numeric non-zero runAsUser when the image
      uses a named user) for every Kubernetes workload.
  checks:
    - evaluator: regex
      # Flags each containers: list in a file that never sets runAsNonRoot: true.
      # Skips Helm templates ({{ ... }}), where security contexts usually come from values.
      pattern: '^[ \t]*containers:[ \t]*\r?$(?![\s\S]*runAsNonRoot:[ \t]*["'']?true)(?<!runAsNonRoot:[ \t]*["'']?true[\s\S]*)(?<!\{\{[\s\S]*)(?![\s\S]*\{\{)(?:(?<=^kind:[\s\S]*)|(?=[\s\S]*^kind:))'
      message: No pod or container in this manifest sets runAsNonRoot true.
      include:
        - "**/k8s/**/*.y*ml"
        - "**/kubernetes/**/*.y*ml"
        - "**/manifests/**/*.y*ml"
        - "**/deploy/**/*.y*ml"
        - "**/deployment/**/*.y*ml"
        - "**/deployments/**/*.y*ml"
        - "**/kustomize/**/*.y*ml"
        - "**/charts/**/templates/**/*.y*ml"
        - "**/helm/**/templates/**/*.y*ml"
      exclude: ["**/.github/**", "**/*compose*.y*ml", "**/kustomization.y*ml", "**/patches/**", "**/*patch*.y*ml"]
  references:
    - { id: CWE-250, title: Execution with Unnecessary Privileges }
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  quality:
    noise: medium
    knownFalsePositives:
      - Settings injected later (Kustomize patches in another file, admission controller mutations). Exclude those paths or grant an exception.
      - The check works per file, so a file with several workloads passes if any one of them sets the field.
  rollout:
    recommendedStage: advise
