apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: K8S-011
  title: Deploy workloads to a dedicated namespace, not default
  type: agent-instruction
  category: infrastructure
spec:
  severity: advisory
  intent: >
    Namespaces are the unit for RBAC, quotas, NetworkPolicies, and Pod Security admission;
    workloads in default share all of them and get none of the isolation.
  requirement: >
    Deploy each application or team into its own namespace, set through Kustomize
    (namespace:), Helm (--namespace), or the manifest, and never into default or kube-system.
  agent:
    summary: >
      Put Kubernetes workloads in a dedicated application namespace; never deploy to default
      or kube-system.
  references:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
  quality:
    noise: low
  rollout:
    recommendedStage: teach
