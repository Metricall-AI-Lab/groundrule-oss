apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: K8S-002
  title: Do not share the host network, PID, or IPC namespace
  type: prohibition
  category: security
spec:
  severity: blocker
  intent: >
    hostNetwork, hostPID, and hostIPC remove the isolation between a pod and its node,
    exposing host processes, node-local services, and other pods' traffic.
  requirement: >
    Do not set hostNetwork, hostPID, or hostIPC to true in pod specs. Expose ports through
    Services and Ingress instead of the host network.
  remediation: >
    Remove the host namespace setting. Use a Service (ClusterIP, NodePort, or LoadBalancer)
    or an Ingress to expose the workload; reserve host namespaces for platform-owned node agents.
  examples:
    forbidden:
      - "hostNetwork: true"
      - "hostPID: true"
  agent:
    summary: >
      Do not set hostNetwork, hostPID, or hostIPC to true in Kubernetes pod specs; expose
      workloads with Services or Ingress.
  checks:
    - evaluator: regex
      pattern: '(?:^[ \t]*|[{,][ \t]*)host(?:Network|PID|IPC):[ \t]*["'']?true\b(?:(?<=^kind:[\s\S]*)|(?=[\s\S]*^kind:))'
      message: Pod shares a host namespace (hostNetwork, hostPID, or hostIPC).
      include:
        - "**/k8s/**/*.y*ml"
        - "**/kubernetes/**/*.y*ml"
        - "**/manifests/**/*.y*ml"
        - "**/deploy/**/*.y*ml"
        - "**/deployment/**/*.y*ml"
        - "**/deployments/**/*.y*ml"
        - "**/kustomize/**/*.y*ml"
        - "**/charts/**/templates/**/*.y*ml"
        - "**/helm/**/templates/**/*.y*ml"
      exclude: ["**/.github/**", "**/*compose*.y*ml"]
  references:
    - { id: CWE-250, title: Execution with Unnecessary Privileges }
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  quality:
    noise: low
    knownFalsePositives:
      - Node-level agents such as node-exporter, CNI plugins, and some ingress controllers that run on the host network by design. Grant an exception for those manifests.
  rollout:
    recommendedStage: advise
