apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: K8S-009
  title: Give long-running containers readiness and liveness probes
  type: agent-instruction
  category: reliability
spec:
  severity: warning
  intent: >
    Without a readiness probe, traffic reaches pods before they can serve it and during
    rollouts; without a liveness probe, a hung process is never restarted.
  requirement: >
    Every long-running container that serves traffic needs a readinessProbe. Add a
    livenessProbe that checks only the process itself (never downstream dependencies, which
    would cascade restarts), and a startupProbe for slow-starting apps instead of a long
    initialDelaySeconds.
  agent:
    summary: >
      Give Kubernetes service containers a readinessProbe, a livenessProbe that checks only
      the process itself (not dependencies), and a startupProbe if startup is slow.
  examples:
    approved:
      - code: |
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
        language: yaml
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  quality:
    noise: low
  rollout:
    recommendedStage: teach
