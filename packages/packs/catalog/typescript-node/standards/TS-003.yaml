apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: TS-003
  title: No eval or new Function
  type: prohibition
  category: security
spec:
  severity: blocker
  scope:
    languages: [typescript, javascript]
  intent: Evaluating strings as code turns any injection bug into remote code execution.
  requirement: >
    Never use eval() or new Function() in application code.
  remediation: >
    Parse the input instead: JSON.parse, a schema, or a lookup table of allowed operations.
  checks:
    - evaluator: regex
      # Skips comment lines, so "we never call eval()" in a comment is not flagged.
      pattern: "^(?![ \\t]*(?://|/?\\*))[^\\n]*?(?:(?<![\\w.$])eval\\s*\\(|\\bnew\\s+Function\\s*\\()"
      include: ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs"]
      exclude: ["**/*.test.*", "**/*.spec.*", "**/test/**", "**/tests/**", "**/__tests__/**", "**/examples/**", "**/example/**", "**/demo/**", "**/docs/**", "**/fixtures/**", "**/benchmarks/**", "**/scripts/**", "**/*.config.*", "**/bin/**"]
      message: eval or new Function in application code
  references:
    - { id: CWE-95, title: "Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')" }
    - { id: CWE-94, title: "Improper Control of Generation of Code ('Code Injection')" }
    - { id: OWASP-A03:2021, title: Injection, url: "https://owasp.org/Top10/A03_2021-Injection/" }
  compliance:
    - { framework: owasp-asvs, controls: [V5.2.4] }
    - { framework: iso-27001, controls: ["8.28"] }
  applicability:
    files: ["**/package.json"]
  quality:
    noise: low
    knownFalsePositives:
      - Sandboxes or code generators that need dynamic evaluation by design. Record an exception for them.
      - The text "eval(" inside a string literal on a code line.
  rollout:
    recommendedStage: enforce
