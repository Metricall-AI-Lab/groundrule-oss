apiVersion: groundrule.dev/v1alpha1
kind: Standard
metadata:
  id: TS-002
  title: No deprecated HTTP and UUID packages
  type: forbidden-tech
  category: dependencies
spec:
  severity: warning
  scope:
    languages: [typescript, javascript]
  intent: These packages are deprecated and no longer receive security fixes.
  requirement: >
    Do not add request, request-promise, or node-uuid. Use fetch (built into Node 18+)
    and crypto.randomUUID() instead.
  checks:
    - evaluator: dependencies
      ecosystems: [npm]
      forbid: [request, request-promise, request-promise-native, node-uuid]
      allowInstead: ["fetch", "crypto.randomUUID()"]
  remediation: >
    Remove the package. Use fetch (built into Node 18+) for HTTP and crypto.randomUUID() for UUIDs.
  references:
    - { id: CWE-1104, title: Use of Unmaintained Third Party Components }
  compliance:
    - { framework: owasp-asvs, controls: [V14.2.1] }
  applicability:
    files: ["**/package.json"]
  quality:
    noise: low
  rollout:
    recommendedStage: enforce
