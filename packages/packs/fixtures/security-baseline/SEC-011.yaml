standard: SEC-011
cases:
  - name: deploy key and PKCS#12 bundle committed
    expect: violation
    count: 2
    files:
      deploy/id_ed25519: "placeholder for a private key file\n"
      certs/server.pfx: "binary key store\n"
  - name: release key store in an Android app
    expect: violation
    files:
      android/app/release.keystore: "binary key store\n"
  - name: public keys, trust stores, debug key store, and test key stores
    expect: clean
    files:
      deploy/id_ed25519.pub: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExample deploy@ci\n"
      config/truststore.jks: "public CA certificates\n"
      android/app/debug.keystore: "android debug key store\n"
      src/test/resources/server-keystore.jks: "test key store\n"
      certs/ca.pem: "-----BEGIN CERTIFICATE-----\n"
