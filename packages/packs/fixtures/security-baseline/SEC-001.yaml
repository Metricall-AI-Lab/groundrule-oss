standard: SEC-001
cases:
  - name: RSA private key committed
    expect: violation
    files:
      deploy/key.pem: |
        -----BEGIN RSA ⟨⟩PRIVATE KEY-----
        MIIEowIBAAKCAQEA0Z3VS5JJcds3xfn/ygWyF8PbnGy0AHB7MaUu1rNhYfWdGq1R
        -----END RSA PRIVATE KEY-----
  - name: OpenSSH private key inside a config file
    expect: violation
    files:
      ops/bootstrap.yaml: |
        ssh_key: |
          -----BEGIN OPENSS⟨⟩H PRIVATE KEY-----
          b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAABlwAAAAdzc2gtcn
          -----END OPENSSH PRIVATE KEY-----
  - name: public keys and certificates are fine
    expect: clean
    files:
      deploy/cert.pem: |
        -----BEGIN CERTIFICATE-----
        MIIDdzCCAl+gAwIBAgIEAgAAuTANBgkqhkiG9w0BAQUFADBaMQswCQYDVQQGEwJJ
        -----END CERTIFICATE-----
      deploy/id_rsa.pub: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC user@host\n"
  - name: code that mentions keys without containing one
    expect: clean
    files:
      src/keys.ts: |
        // Load the private key from the secret manager, never from the repository.
        export const key = await secrets.get("signing-private-key");
  - name: throwaway TLS key in Go testdata (real-repo regression, gin)
    expect: clean
    files:
      testdata/certificate/key.pem: |
        -----BEGIN RSA ⟨⟩PRIVATE KEY-----
        MIIEowIBAAKCAQEA0Z3VS5JJcds3xfn/ygWyF8PbnGy0AHB7MaUu1rNhYfWdGq1R
        -----END RSA PRIVATE KEY-----
