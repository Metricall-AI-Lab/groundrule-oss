standard: ARCH-012
cases:
  - name: seven parameters and five levels of nesting
    expect: violation
    count: 2
    files:
      src/place.ts: |
        export function place(a, b, c, d, e, f, g) {
          if (a) {
            if (b) {
              for (const x of c) {
                if (d) {
                  if (e) {
                    return x;
                  }
                }
              }
            }
          }
          return f + g;
        }
