  - name: short, flat functions
    expect: clean
    files:
      src/ok.ts: |
        export function place(order: Order, options: PlaceOptions) {
          if (!order) return null;
          for (const line of order.lines) {
            if (line.qty > 0) total += line.qty;
          }
          return total;
        }
      app/ok.py: |
        def place(self, order, options):
            if not order:
                return None
            for line in order.lines:
                if line.qty > 0:
                    total += line.qty
            return total
