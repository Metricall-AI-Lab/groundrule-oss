standard: K8S-012
cases:
  - name: wildcard verbs, wildcard resources in a block list, and a cluster-admin binding
    expect: violation
    count: 3
    files:
      k8s/rbac.yaml: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: deployer
        rules:
          - apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "*"]
          - apiGroups: [""]
            verbs:
              - get
            resources:
              - pods
              - "*"
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: deployer
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
          - kind: ServiceAccount
            name: deployer
            namespace: ci
  - name: explicit rules, a binding to a custom role, and wildcard-like strings
    expect: clean
    files:
      k8s/rbac.yaml: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: reader
        rules:
          - apiGroups: [""]
            resources: ["configmaps", "pods/*"]
            verbs: ["get", "list", "watch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: cluster-admin-readers
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: reader
        subjects:
          - kind: Group
            name: cluster-admin-readers
      deploy/permissions.yml: |
        permissions:
          verbs: ["*"]
