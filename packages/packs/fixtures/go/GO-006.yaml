standard: GO-006
cases:
  - name: package-level helpers and the default client
    expect: violation
    count: 3
    files:
      internal/billing/client.go: |
        package billing

        func Fetch(url string) (*http.Response, error) {
        	resp, err := http.Get(url)
        	if err != nil {
        		return nil, err
        	}
        	return http.DefaultClient.Do(req)
        }

        var client = &http.Client{}
