standard: JAVA-006
cases:
  - name: "@Transactional on private methods, with attributes and other annotations"
    expect: violation
    count: 2
    files:
      pom.xml: "<project><dependencies><dependency><artifactId>spring-boot-starter-web</artifactId></dependency></dependencies></project>"
      src/main/java/acme/ClaimService.java: |
        @Service
        public class ClaimService {
          @Transactional
          private void applyPayment(long claimId) {}

          @Transactional(propagation = Propagation.REQUIRES_NEW, rollbackFor = {IOException.class})
          @Timed("audit")
          private void audit(long claimId) {}
        }
  - name: public transactional method calling a private helper
    expect: clean
    files:
      pom.xml: "<project><dependencies><dependency><artifactId>spring-boot-starter-web</artifactId></dependency></dependencies></project>"
      src/main/java/acme/ClaimService.java: |
        @Service
        public class ClaimService {
          @Transactional(readOnly = true)
          public Claim find(long id) { return load(id); }

          @Transactional
          protected void settle(long id) { applyPayment(id); }

          private Claim load(long id) { return null; }

          private void applyPayment(long id) {}
        }
