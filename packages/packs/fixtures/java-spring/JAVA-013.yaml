standard: JAVA-013
cases:
  - name: "@Data on entities, in either order and with other annotations"
    expect: violation
    count: 2
    files:
      src/main/java/acme/Claim.java: |
        @Entity
        @Table(name = "claims", indexes = @Index(columnList = "owner_id"))
        @Data
        public class Claim {
          @Id @GeneratedValue private Long id;
        }
      src/main/java/acme/LineItem.java: |
        @lombok.Data @NoArgsConstructor
        @jakarta.persistence.Entity
        public class LineItem { @Id private Long id; }
  - name: "@Getter/@Setter entities, @Data DTOs, listeners, and tests"
    expect: clean
    files:
      src/main/java/acme/Claim.java: |
        @Entity
        @EntityListeners(AuditingEntityListener.class)
        @Getter
        @Setter
        public class Claim {
          @Id @GeneratedValue private Long id;
        }
      src/main/java/acme/ClaimDto.java: |
        @Data
        @Builder
        public class ClaimDto { private Long id; }
      src/test/java/acme/ClaimRepositoryTest.java: |
        @DataJpaTest
        class ClaimRepositoryTest {
          @Entity @Data static class Fixture { @Id Long id; }
        }
