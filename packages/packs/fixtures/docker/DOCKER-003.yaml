standard: DOCKER-003
cases:
  - name: ADD for local files and an unchecked URL
    expect: violation
    count: 2
    files:
      Dockerfile: |
        FROM node:22-alpine
        ADD . /app
        ADD https://example.com/install.sh /tmp/install.sh
  - name: COPY, local tar extraction, ADD with --checksum, and comments
    expect: clean
    files:
      Dockerfile: |
        FROM debian:12-slim
        # ADD . /app would also work but COPY is clearer
        COPY . /app
        ADD rootfs.tar.gz /
        ADD --checksum=sha256:24454f830cdb571e2c4ad15481119c43b3cafd48dd869a9b2945d1036d1dc68d https://example.com/tool.tar.gz /tmp/
        RUN useradd app && echo "ADD more later"
