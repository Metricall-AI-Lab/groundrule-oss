standard: DOCKER-005
cases:
  - name: credentials in ARG and ENV
    expect: violation
    count: 4
    files:
      Dockerfile: |
        FROM node:22-alpine
        ARG NPM_TOKEN
        ENV DB_PASSWORD=hunter2
        ENV AWS_REGION=eu-west-1 AWS_SECRET_ACCESS_KEY=abc
        env GITHUB_TOKEN ghp_example
  - name: secret mounts, *_FILE variables, and look-alike names
    expect: clean
    files:
      Dockerfile: |
        FROM python:3.12-slim
        # ARG NPM_TOKEN is not needed any more
        ENV DB_PASSWORD_FILE=/run/secrets/db_password
        ENV TOKENIZERS_PARALLELISM=false
        ENV GPG_KEY=7169605F62C751356D054A26A821E680E5FA6305
        ARG TOKEN_ENDPOINT=https://auth.example.com/token
        RUN --mount=type=secret,id=npm_token NPM_TOKEN=$(cat /run/secrets/npm_token) npm ci
