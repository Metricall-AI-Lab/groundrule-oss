standard: DOCKER-001
cases:
  - name: single stage without USER
    expect: violation
    files:
      Dockerfile: |
        FROM node:22-alpine
        WORKDIR /app
        COPY . .
        CMD ["node", "server.js"]
  - name: USER only in the builder stage, final stage runs as root
    expect: violation
    files:
      services/api/Dockerfile: |
        FROM golang:1.23 AS build
        USER builder
        RUN go build -o /out/app ./cmd/app

        FROM debian:12-slim
        COPY --from=build /out/app /app
        ENTRYPOINT ["/app"]
  - name: switches back to root at the end
    expect: violation
    files:
      Dockerfile.prod: |
        FROM python:3.12-slim
        USER app
        RUN pip install --user -r requirements.txt
        USER root
        CMD ["python", "main.py"]
  - name: multi-stage build where only the final stage sets a non-root USER, plus a commented USER
    expect: clean
    files:
      Dockerfile: |
        # USER root is needed for the builder only
        FROM golang:1.23 AS build
        RUN go build -o /out/app ./cmd/app

        FROM gcr.io/distroless/static-debian12:nonroot
        COPY --from=build /out/app /app
        USER 65532:65532
        ENTRYPOINT ["/app"]
      docker/worker.dockerfile: |
        FROM node:22-alpine
        USER root
        RUN apk add --no-cache tini
        USER node
        CMD ["node", "worker.js"]
      README.md: "FROM node:22\nCMD node app.js\n"
