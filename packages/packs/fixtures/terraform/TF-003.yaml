standard: TF-003
cases:
  - name: root module without a lock file
    expect: violation
    files:
      infra/main.tf: |
        terraform {
          required_providers {
            aws = { source = "hashicorp/aws", version = "~> 5.40" }
          }
        }
  - name: lock file committed next to the root module
    expect: clean
    files:
      infra/main.tf: |
        terraform {
          required_providers {
            aws = { source = "hashicorp/aws", version = "~> 5.40" }
          }
        }
      infra/.terraform.lock.hcl: |
        provider "registry.terraform.io/hashicorp/aws" {
          version     = "5.40.0"
          constraints = "~> 5.40"
        }
  - name: no Terraform code in the repository
    expect: clean
    files:
      README.md: "Not an infrastructure repository.\n"
