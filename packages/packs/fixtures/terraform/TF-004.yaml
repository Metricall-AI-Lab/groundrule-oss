standard: TF-004
cases:
  - name: Git and GitHub module sources without a ref
    expect: violation
    count: 3
    files:
      infra/main.tf: |
        module "vpc" {
          source = "git::https://github.com/acme/tf-vpc.git"
        }
        module "dns" {
          source = "github.com/acme/tf-dns"
        }
        module "iam" {
          source = "git@github.com:acme/tf-iam.git//modules/role"
        }
  - name: pinned Git sources, registry modules with versions, local paths, and providers
    expect: clean
    files:
      infra/main.tf: |
        terraform {
          required_providers {
            github = {
              source  = "integrations/github"
              version = "~> 6.0"
            }
          }
        }
        module "vpc" {
          source = "git::https://github.com/acme/tf-vpc.git?ref=v2.3.1"
        }
        module "iam" {
          source = "git@github.com:acme/tf-iam.git//modules/role?ref=4f2c9a1e0b7d3c5a6e8f9b0c1d2e3f4a5b6c7d8e"
        }
        module "eks" {
          source  = "terraform-aws-modules/eks/aws"
          version = "~> 20.8"
        }
        module "app" {
          source = "./modules/app"
        }
        # module "old" { source = "git::https://github.com/acme/old.git" }
