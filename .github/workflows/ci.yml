name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Dogfooding: Groundrule checks its own repository with the CLI it just built.
      - run: node packages/cli/dist/bin.js sync --check
      - run: node packages/cli/dist/bin.js check --all --summary "$GITHUB_STEP_SUMMARY"
